name: Link check

# Checks every outside link on shelterdayout.com and shelteradoption.com (and the vet data) from GitHub's network.
# Results: data/linkcheck.json on the linkcheck-data branch.
on:
  workflow_dispatch:
  schedule:
    - cron: "29 9 * * 1"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Site check (internal links, page size, structured data, scripts)
        continue-on-error: true
        run: python3 tools/site_check.py
      - name: Check links
        run: python3 tools/linkcheck.py
      - name: Save dead-link list to main (the build hides dead links)
        run: |
          git config user.name shelterdayout-bot && git config user.email hello@shelterdayout.com
          git add data/dead_links.json
          git diff --cached --quiet || (git commit -qm "Link check: update dead links list" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done)
      - name: Save results
        run: |
          mkdir -p out/data && cp data/linkcheck.json out/data/
          cd out && git init -q -b linkcheck-data && git config user.name shelterdayout-bot && git config user.email hello@shelterdayout.com
          git add data/linkcheck.json && git commit -qm "Link check $(date -u +%FT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" linkcheck-data
