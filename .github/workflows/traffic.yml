name: Traffic snapshot

# On-demand traffic check for both sites (shelterdayout.com + shelteradoption.com), for Claude's cloud tasks.
# Start:  gh api -X POST repos/CopernicusHedgeFund/shelterdayout/actions/workflows/traffic.yml/dispatches -f ref=main
# Read (~1 min later): gh api "repos/CopernicusHedgeFund/shelterdayout/contents/data/traffic_live.json?ref=traffic-data" -H "Accept: application/vnd.github.raw"
# The run proves itself to the server with a GitHub identity token; no secret is stored anywhere.
# Also runs by itself every hour, so a recent snapshot is usually waiting without anyone triggering it.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch
        run: |
          mkdir -p out/data
          T=$(curl -sS -f -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=shelterdayout-traffic" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$T"
          for n in 1 2 3; do
            code=$(curl -sS -m 90 -A "ShelterDayOut-traffic-snapshot" --data-urlencode "t=$T" "https://shelterdayout.com/api/traffic.php" -o out/data/traffic_live.json -w "%{http_code}")
            if [ "$code" = "200" ] && head -c 1 out/data/traffic_live.json | grep -q '{'; then break; fi
            echo "attempt $n: $code"; head -c 600 out/data/traffic_live.json; echo
            [ "$n" = 3 ] && exit 1
            sleep 20
          done
          python3 -c "import json;d=json.load(open('out/data/traffic_live.json'));[print(h,x['date'],x['views'],x['visitors'],x['people_visitors']) for h,s in d['sites'].items() for x in s['daily'][-7:]]"
      - name: Save to traffic-data branch
        run: |
          cd out
          git init -q -b traffic-data
          git config user.name "shelterdayout-bot"
          git config user.email "hello@shelterdayout.com"
          git add data/traffic_live.json
          git commit -qm "Traffic snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" traffic-data
