name: Google search numbers

# Google clicks, impressions, top searches and top pages for shelterdayout.com + shelteradoption.com,
# read from Search Console by the read-only gsc-reader account. Runs daily in the cloud, no laptop needed.
# On demand: gh api -X POST repos/CopernicusHedgeFund/shelterdayout/actions/workflows/gsc_daily.yml/dispatches -f ref=main
# Read:      gh api "repos/CopernicusHedgeFund/shelterdayout/contents/data/gsc_daily.json?ref=gsc-data" -H "Accept: application/vnd.github.raw"
on:
  schedule:
    - cron: "43 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: gsc-daily
  cancel-in-progress: false

jobs:
  google:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/851892333075/locations/global/workloadIdentityPools/github/providers/github
          service_account: gsc-reader@altmountain-gsc.iam.gserviceaccount.com
      - run: pip install -q google-auth requests
      - run: python3 -I tools/gsc_daily.py
      - name: Save to gsc-data branch
        run: |
          cd out
          git init -q -b gsc-data
          git config user.name "shelterdayout-bot"
          git config user.email "bot@shelterdayout.com"
          git add data/gsc_daily.json
          git commit -qm "Google search numbers $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gsc-data
