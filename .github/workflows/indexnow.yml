name: IndexNow ping

# Tells Bing (and Yandex, Seznam, Naver via IndexNow) which pages changed, right after each push that rebuilds the sites.
# Changed = pages whose content hash in dist*/lastmod.json differs from the previous commit (new pages included).
on:
  push:
    branches: [main]
    paths: ["dist/lastmod.json", "dist_adopt/lastmod.json"]
  workflow_dispatch:
    inputs:
      all:
        description: "1 = submit every URL of both sites"
        required: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the live site to have the new pages (hourly publish at :37)
        if: ${{ github.event_name == 'push' }}
        run: echo "IndexNow only needs the URLs; engines crawl them later, so no wait is needed."
      - name: Submit changed URLs
        env:
          ALL: ${{ inputs.all }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          key = re.search(r'INDEXNOW_KEY = "([0-9a-f]+)"', open("build.py").read()).group(1)
          sites = {"dist": "https://shelterdayout.com", "dist_adopt": "https://shelteradoption.com"}
          for folder, site in sites.items():
              cur = json.load(open(f"{folder}/lastmod.json"))
              prev = {}
              if os.environ.get("ALL") != "1":
                  try:
                      prev = json.loads(subprocess.run(["git", "show", f"HEAD~1:{folder}/lastmod.json"], capture_output=True, text=True, check=True).stdout)
                  except Exception:
                      prev = {}
              urls = [site + u for u, v in cur.items() if prev.get(u, {}).get("h") != v["h"]]
              print(site, len(urls), "changed")
              for i in range(0, len(urls), 9000):
                  body = json.dumps({"host": site.split("//")[1], "key": key, "keyLocation": f"{site}/{key}.txt", "urlList": urls[i:i + 9000]}).encode()
                  req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          print(" ->", r.status)
                  except urllib.error.HTTPError as e:
                      print(" ->", e.code, e.read()[:200])
          PY
