 <path d="M-25 2 l3 3 l3 -3" stroke="#ffb199" stroke-width="2" fill="none"/>
 <rect x="-34" y="30" width="12" height="8" rx="4" fill="#555b6e"/><rect x="40" y="30" width="12" height="8" rx="4" fill="#555b6e"/>
</g>
