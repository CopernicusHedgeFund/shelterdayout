<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-labelledby="t">
<title id="t">Two shelter cats relaxing: one in a cardboard box, one playing with a ball of yarn</title>
<rect x="0" y="200" width="420" height="60" rx="0" fill="#f3e2c4"/>
<!-- window -->
<rect x="250" y="20" width="140" height="110" rx="10" fill="#cfeee6" stroke="#fff" stroke-width="8"/>
<line x1="320" y1="20" x2="320" y2="130" stroke="#fff" stroke-width="6"/><line x1="250" y1="75" x2="390" y2="75" stroke="#fff" stroke-width="6"/>
<circle cx="360" cy="48" r="14" fill="#ffd166"/>
<!-- box -->
<path d="M40 130 L190 130 L180 220 L50 220Z" fill="#d9a066"/>
<path d="M40 130 L10 105 L120 105 L150 130Z" fill="#e8b97f"/>
<path d="M190 130 L215 104 L150 104 L120 130Z" fill="#c98d52"/>
<text x="78" y="185" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#8a5a2b">ADOPT ME</text>
<!-- orange cat in box -->
<g transform="translate(115 100)">
 <path d="M-30 -28 L-22 -58 L-6 -36Z M30 -28 L22 -58 L6 -36Z" fill="#f4a259"/>
