 <path d="M0 2 q-6 8 -12 4 M0 2 q6 8 12 4" stroke="#3b2a20" stroke-width="2" fill="none"/>
 <g stroke="#3b2a20" stroke-width="1.5"><line x1="-18" y1="0" x2="-40" y2="-4"/><line x1="-18" y1="4" x2="-40" y2="8"/><line x1="18" y1="0" x2="40" y2="-4"/><line x1="18" y1="4" x2="40" y2="8"/></g>
 <path d="M-20 -36 q4 8 0 14 M0 -42 q4 8 0 14 M20 -36 q4 8 0 14" stroke="#e08a3c" stroke-width="3" fill="none"/>
</g>
<!-- grey cat playing -->
