<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="t">
<title id="t">A calendar with a paw print and a party hat, for adoption event days</title>
<rect width="420" height="240" rx="24" fill="#fff7e6"/>
<g transform="translate(130 40)">
 <rect x="0" y="20" width="160" height="150" rx="16" fill="#fff" stroke="#2b2d42" stroke-width="4"/>
 <path d="M0 36 a16 16 0 0 1 16 -16 h128 a16 16 0 0 1 16 16 v24 h-160z" fill="#2a9d8f" stroke="#2b2d42" stroke-width="4"/>
 <rect x="34" y="6" width="12" height="30" rx="6" fill="#2b2d42"/><rect x="114" y="6" width="12" height="30" rx="6" fill="#2b2d42"/>
 <text x="80" y="52" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="18" font-weight="700" fill="#fff">ADOPTION DAY</text>
 <g fill="#e76f51" transform="translate(80 118)">
  <ellipse cx="0" cy="10" rx="22" ry="18"/><circle cx="-24" cy="-14" r="9"/><circle cx="-8" cy="-26" r="9"/><circle cx="10" cy="-26" r="9"/><circle cx="26" cy="-14" r="9"/>
  <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.2s" additive="sum" repeatCount="indefinite"/>
 </g>
</g>
<!-- party hat -->
<g transform="translate(272 18) rotate(18)"><path d="M0 60 L22 0 L44 60z" fill="#ffd166" stroke="#2b2d42" stroke-width="3"/><path d="M8 40 l28 0 M14 24 l16 0" stroke="#ff7a59" stroke-width="5"/><circle cx="22" cy="0" r="7" fill="#ff7a59"/></g>
<!-- confetti + hearts -->
<g><rect x="70" y="60" width="10" height="5" fill="#2a9d8f" transform="rotate(30 75 62)"/><rect x="340" y="170" width="10" height="5" fill="#ff7a59" transform="rotate(-25 345 172)"/><rect x="60" y="180" width="10" height="5" fill="#ffd166" transform="rotate(60 65 182)"/>
<circle cx="350" cy="110" r="5" fill="#e76f51"/><circle cx="90" cy="120" r="4" fill="#2a9d8f"/></g>
<path d="M352 70 c-6 -9 -18 -3 -12 7 l12 12 l12 -12 c6 -10 -6 -16 -12 -7z" fill="#ff7a8a"><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2s" repeatCount="indefinite"/></path>
</svg>
